# Static SPA host for apps/web.
#
# TLS, the hostname and access control are Traefik's job — this server only hands
# out files and proxies API calls so the browser talks to one origin.
#
# UPSTREAM RESOLUTION: every proxy_pass goes through a VARIABLE, with Docker's
# embedded DNS declared as the resolver. This is not a style choice —
# `proxy_pass http://api:3001` makes nginx resolve "api" at config-parse time and
# refuse to start with `host not found in upstream "api"` whenever the API
# container is not already up. It also pins the first IP forever, so a redeployed
# API becomes unreachable until nginx restarts. A variable defers resolution to
# request time and re-resolves on the TTL below.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck target. Deliberately served locally so web reports
    # healthy even when the API is down — they are separate concerns.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Server-sent events for job progress. Must come BEFORE the /api/ block:
    # nginx picks the longest matching prefix, and buffering has to be off here or
    # the client receives nothing until the stream ends.
    location ^~ /api/jobs/ {
        set $api_sse http://api:3001;
        proxy_pass $api_sse;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection must be empty for keep-alive to the upstream on HTTP/1.1; nginx would
        # otherwise forward the client's `Connection: keep-alive` verbatim and some upstreams
        # close the socket.
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # EXPLICIT, not inherited. `gzip_types` below does not list text/event-stream so this is
        # already the effective behaviour — but compression on an SSE stream buffers it until the
        # window fills, which looks exactly like a hung job, and relying on a type list to prevent
        # that is relying on nobody ever adding a type.
        gzip off;

        # A walk-forward optimisation runs for minutes with no HTTP activity other than the
        # heartbeat; both directions get the full budget so neither side times the stream out.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # The REST API. Same-origin in production, matching the Vite dev proxy, so no
    # CORS behaviour differs between dev and prod.
    location /api/ {
        set $api_rest http://api:3001;
        proxy_pass $api_rest;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A tick-history upload can be several hundred MB.
        client_max_body_size 1g;

        # Ingest and backtest requests are long-running.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The API's health endpoint sits outside /api on purpose (see apps/api/main.ts).
    location = /health {
        set $api_health http://api:3001;
        proxy_pass $api_health/health;
        proxy_set_header Host $host;
    }

    # Hashed assets are immutable; everything else must revalidate so a deploy is
    # picked up without a hard refresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes are not real files.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No CSP here: it belongs with the app's own asset policy, and a wrong one
    # silently breaks Monaco's web workers.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
